name: AFE admin-only fields and exports

on:
  push:
    branches: [feat/afe-admin-only-fields]
  pull_request:
    branches: [main]
    paths:
      - 'wp-content/plugins/alavi-form-engine/src/Admin/**'
      - 'wp-content/plugins/alavi-form-engine/src/Export/**'
      - 'wp-content/plugins/alavi-form-engine/src/Database/Migrator.php'
      - 'wp-content/plugins/alavi-form-engine/src/Repository/SubmissionRepository.php'
      - 'wp-content/plugins/alavi-form-engine/src/Submission/SubmissionService.php'
      - 'wp-content/plugins/alavi-form-engine/assets/js/admin.js'
      - 'wp-content/plugins/alavi-form-engine/tests/admin-submission-*'
      - 'wp-content/themes/ostadsho-child/inc/forms/class-ba-jihadi-group-registration-form.php'
      - '.github/workflows/afe-admin-only-fields.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-fields:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: PHP syntax
        run: |
          php -l wp-content/plugins/alavi-form-engine/src/Admin/AdminFields.php
          php -l wp-content/plugins/alavi-form-engine/src/Admin/FormsPage.php
          php -l wp-content/plugins/alavi-form-engine/src/Admin/SubmissionsPage.php
          php -l wp-content/plugins/alavi-form-engine/src/Database/Migrator.php
          php -l wp-content/plugins/alavi-form-engine/src/Repository/SubmissionRepository.php
          php -l wp-content/plugins/alavi-form-engine/src/Submission/SubmissionService.php
          php -l wp-content/plugins/alavi-form-engine/src/Export/ExcelExporter.php
          php -l wp-content/plugins/alavi-form-engine/src/Export/ExportProfile.php
          php -l wp-content/plugins/alavi-form-engine/src/Export/ExportConfigSanitizer.php
          php -l wp-content/plugins/alavi-form-engine/src/Export/PdfTemplateRenderer.php
          php -l wp-content/themes/ostadsho-child/inc/forms/class-ba-jihadi-group-registration-form.php
          php -l wp-content/plugins/alavi-form-engine/tests/admin-submission-fields.php
          php -l wp-content/plugins/alavi-form-engine/tests/admin-submission-field-storage.php
          php -l wp-content/plugins/alavi-form-engine/tests/admin-submission-field-integration.php
          node --check wp-content/plugins/alavi-form-engine/assets/js/admin.js
      - name: Functional admin-field and DB isolation tests
        run: |
          php wp-content/plugins/alavi-form-engine/tests/admin-submission-fields.php
          php wp-content/plugins/alavi-form-engine/tests/admin-submission-field-storage.php
          php wp-content/plugins/alavi-form-engine/tests/admin-submission-field-integration.php
      - name: Existing form and export configuration regression
        run: |
          php wp-content/plugins/alavi-form-engine/tests/export-config-sanitizer.php
          php wp-content/themes/ostadsho-child/tests/jihadi-form-definition.php
          node wp-content/plugins/alavi-form-engine/tests/frontend-css-regression.js
