name: AFE duplicate draft resume checks

on:
  push:
    branches: [feature/duplicate-draft-resume]
  pull_request:
    branches: [main]
    paths:
      - 'wp-content/plugins/alavi-form-engine/src/Duplicate/**'
      - 'wp-content/plugins/alavi-form-engine/src/Submission/SubmissionService.php'
      - 'wp-content/plugins/alavi-form-engine/src/Form/Form.php'
      - 'wp-content/plugins/alavi-form-engine/src/Admin/FormsPage.php'
      - 'wp-content/plugins/alavi-form-engine/assets/**'
      - 'wp-content/plugins/alavi-form-engine/tests/duplicate-*'
      - 'wp-content/plugins/alavi-form-engine/tests/live-duplicate-check.php'
      - 'wp-content/themes/ostadsho-child/inc/forms/class-ba-jihadi-group-registration-form.php'
      - 'wp-content/themes/ostadsho-child/tests/jihadi-form-definition.php'
      - '.github/workflows/afe-duplicate-draft-resume.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duplicate-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: PHP syntax
        run: |
          php -l wp-content/plugins/alavi-form-engine/src/Submission/SubmissionService.php
          php -l wp-content/plugins/alavi-form-engine/src/Duplicate/DuplicatePolicy.php
          php -l wp-content/plugins/alavi-form-engine/src/Admin/FormsPage.php
          php -l wp-content/plugins/alavi-form-engine/src/Form/Form.php
          php -l wp-content/plugins/alavi-form-engine/alavi-form-engine.php
          php -l wp-content/plugins/alavi-form-engine/tests/duplicate-draft-resume.php
          php -l wp-content/themes/ostadsho-child/inc/forms/class-ba-jihadi-group-registration-form.php
      - name: Duplicate engine regression
        run: |
          php wp-content/plugins/alavi-form-engine/tests/duplicate-policy.php
          php wp-content/plugins/alavi-form-engine/tests/duplicate-repository.php
          php wp-content/plugins/alavi-form-engine/tests/live-duplicate-check.php
          php wp-content/plugins/alavi-form-engine/tests/duplicate-draft-resume.php
      - name: Jihadi form regression
        run: php wp-content/themes/ostadsho-child/tests/jihadi-form-definition.php
      - name: JavaScript syntax
        run: node --check wp-content/plugins/alavi-form-engine/assets/js/frontend.js
