name: AFE per-form admin-only submission fields

on:
  push:
    branches: [feat/afe-admin-submission-fields]
  pull_request:
    branches: [main]
    paths:
      - 'wp-content/plugins/alavi-form-engine/src/Admin/**'
      - 'wp-content/plugins/alavi-form-engine/src/Export/**'
      - 'wp-content/plugins/alavi-form-engine/src/Submission/SubmissionService.php'
      - 'wp-content/plugins/alavi-form-engine/assets/js/admin.js'
      - 'wp-content/plugins/alavi-form-engine/assets/css/admin.css'
      - 'wp-content/plugins/alavi-form-engine/tests/admin-submission-fields*'
      - 'wp-content/themes/ostadsho-child/inc/forms/class-ba-jihadi-group-registration-form.php'
      - '.github/workflows/afe-admin-submission-fields.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-fields:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: PHP lint
        run: |
          for file in \
            wp-content/plugins/alavi-form-engine/src/Admin/AdminSubmissionFields.php \
            wp-content/plugins/alavi-form-engine/src/Admin/FormDataPresenter.php \
            wp-content/plugins/alavi-form-engine/src/Admin/FormsPage.php \
            wp-content/plugins/alavi-form-engine/src/Submission/SubmissionService.php \
            wp-content/plugins/alavi-form-engine/src/Export/ExportProfile.php \
            wp-content/plugins/alavi-form-engine/src/Export/ExcelExporter.php \
            wp-content/plugins/alavi-form-engine/src/Export/PdfTemplateRenderer.php \
            wp-content/plugins/alavi-form-engine/src/Export/ExportConfigSanitizer.php \
            wp-content/themes/ostadsho-child/inc/forms/class-ba-jihadi-group-registration-form.php \
            wp-content/plugins/alavi-form-engine/tests/admin-submission-fields.php \
            wp-content/plugins/alavi-form-engine/tests/admin-submission-fields-integration.php; do php -l "$file"; done
      - name: Admin-only field security, display and export regression
        run: |
          php wp-content/plugins/alavi-form-engine/tests/admin-submission-fields.php
          php wp-content/plugins/alavi-form-engine/tests/admin-submission-fields-integration.php
          php wp-content/themes/ostadsho-child/tests/jihadi-form-definition.php
      - name: Existing submissions and export configuration regression
        run: |
          php wp-content/plugins/alavi-form-engine/tests/export-config-sanitizer.php
          php wp-content/plugins/alavi-form-engine/tests/input-mask-admin-presenter.php
          php wp-content/plugins/alavi-form-engine/tests/duplicate-policy.php
      - name: Admin javascript syntax
        run: node --check wp-content/plugins/alavi-form-engine/assets/js/admin.js
