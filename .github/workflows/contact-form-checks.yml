name: Contact form checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'wp-content/themes/ostadsho-child/inc/forms/class-ba-contact-form.php'
      - 'wp-content/themes/ostadsho-child/tests/contact-form-definition.php'
      - '.github/workflows/contact-form-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contact-form:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Check PHP syntax
        run: |
          php -l wp-content/themes/ostadsho-child/inc/forms/class-ba-contact-form.php
          php -l wp-content/themes/ostadsho-child/tests/contact-form-definition.php
      - name: Contact form regression
        run: php wp-content/themes/ostadsho-child/tests/contact-form-definition.php
