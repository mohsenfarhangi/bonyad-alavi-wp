name: Quick Support phase 1 and 2 checks

on:
  push:
    branches:
      - 'feat/quick-support-phase1-*'
      - 'feat/quick-support-reports-*'
  pull_request:
    branches: [main]
    paths:
      - 'wp-content/plugins/alavi-form-engine/src/Context/**'
      - 'wp-content/plugins/alavi-form-engine/src/Actions/ActionContext.php'
      - 'wp-content/plugins/alavi-form-engine/src/Form/Validator.php'
      - 'wp-content/plugins/alavi-form-engine/src/Form/Renderer.php'
      - 'wp-content/plugins/alavi-form-engine/src/Form/Fields/SelectField.php'
      - 'wp-content/plugins/alavi-form-engine/src/Elementor/FormWidget.php'
      - 'wp-content/plugins/alavi-form-engine/src/Submission/SubmissionService.php'
      - 'wp-content/plugins/alavi-form-engine/src/Validation/ValidatorDefinition.php'
      - 'wp-content/plugins/alavi-form-engine/assets/js/frontend.js'
      - 'wp-content/plugins/alavi-form-engine/tests/form-context-*.php'
      - 'wp-content/plugins/alavi-form-engine/tests/action-context-form-context.php'
      - 'wp-content/themes/ostadsho-child/inc/quick-support/**'
      - 'wp-content/themes/ostadsho-child/tests/quick-support-reports.php'
      - 'wp-content/themes/ostadsho-child/inc/forms/class-ba-quick-support-form.php'
      - 'wp-content/themes/ostadsho-child/inc/woocommerce/class-ba-quick-support-*.php'
      - 'wp-content/themes/ostadsho-child/inc/woocommerce/class-ba-participation-payment-gateway-service.php'
      - 'wp-content/themes/ostadsho-child/inc/admin/settings/tab-participation.php'
      - 'wp-content/themes/ostadsho-child/tests/quick-support-form-definition.php'
      - 'wp-content/themes/ostadsho-child/tests/quick-support-category-context.php'
      - 'wp-content/themes/ostadsho-child/tests/quick-support-payment-rules.php'
      - 'wp-content/themes/ostadsho-child/assets/js/ba-quick-support-form.js'
      - 'wp-content/themes/ostadsho-child/assets/css/ba-quick-support-form.css'
      - 'wp-content/themes/ostadsho-child/assets/css/ba-quick-support-reports.css'
      - 'wp-content/themes/ostadsho-child/functions.php'
      - '.github/workflows/quick-support-phase1-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: PHP syntax
        run: |
          find wp-content/plugins/alavi-form-engine/src/Context -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l wp-content/plugins/alavi-form-engine/src/Actions/ActionContext.php
          php -l wp-content/plugins/alavi-form-engine/src/Form/Validator.php
          php -l wp-content/plugins/alavi-form-engine/src/Form/Renderer.php
          php -l wp-content/plugins/alavi-form-engine/src/Form/Fields/SelectField.php
          php -l wp-content/plugins/alavi-form-engine/src/Elementor/FormWidget.php
          php -l wp-content/plugins/alavi-form-engine/src/Submission/SubmissionService.php
          php -l wp-content/plugins/alavi-form-engine/src/Validation/ValidatorDefinition.php
          php -l wp-content/themes/ostadsho-child/functions.php
          php -l wp-content/themes/ostadsho-child/inc/quick-support/class-ba-quick-support-category.php
          php -l wp-content/themes/ostadsho-child/inc/quick-support/class-ba-quick-support-category-context-provider.php
          php -l wp-content/themes/ostadsho-child/inc/quick-support/class-ba-quick-support-report-service.php
          php -l wp-content/themes/ostadsho-child/inc/quick-support/class-ba-quick-support-reports.php
          php -l wp-content/themes/ostadsho-child/inc/forms/class-ba-quick-support-form.php
          php -l wp-content/themes/ostadsho-child/inc/woocommerce/class-ba-quick-support-payment-service.php
          php -l wp-content/themes/ostadsho-child/inc/woocommerce/class-ba-quick-support-payment-action.php
          php -l wp-content/themes/ostadsho-child/inc/woocommerce/class-ba-participation-payment-gateway-service.php
          php -l wp-content/themes/ostadsho-child/inc/admin/settings/tab-participation.php
          php -l wp-content/plugins/alavi-form-engine/tests/form-context-manager.php
          php -l wp-content/plugins/alavi-form-engine/tests/action-context-form-context.php
          php -l wp-content/plugins/alavi-form-engine/tests/form-context-validator.php
          php -l wp-content/themes/ostadsho-child/tests/quick-support-form-definition.php
          php -l wp-content/themes/ostadsho-child/tests/quick-support-category-context.php
          php -l wp-content/themes/ostadsho-child/tests/quick-support-payment-rules.php
      - name: AFE context and validator tests
        run: |
          php wp-content/plugins/alavi-form-engine/tests/form-context-manager.php
          php wp-content/plugins/alavi-form-engine/tests/action-context-form-context.php
          php wp-content/plugins/alavi-form-engine/tests/form-context-validator.php
          php wp-content/plugins/alavi-form-engine/tests/validator-registry.php
          php wp-content/plugins/alavi-form-engine/tests/cross-field-validator-context.php
          php wp-content/plugins/alavi-form-engine/tests/elementor-registration.php
      - name: Theme form regression
        run: |
          php wp-content/themes/ostadsho-child/tests/quick-support-form-definition.php
          php wp-content/themes/ostadsho-child/tests/quick-support-category-context.php
          php wp-content/themes/ostadsho-child/tests/quick-support-reports.php
          php wp-content/themes/ostadsho-child/tests/quick-support-payment-rules.php
          php wp-content/themes/ostadsho-child/tests/facilitator-form-definition.php
          php wp-content/themes/ostadsho-child/tests/jihadi-form-definition.php
          php wp-content/themes/ostadsho-child/tests/camp-admission-form-definition.php
      - name: JavaScript syntax
        run: |
          node --check wp-content/plugins/alavi-form-engine/assets/js/frontend.js
          node --check wp-content/themes/ostadsho-child/assets/js/ba-quick-support-form.js
